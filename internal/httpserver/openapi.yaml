openapi: 3.0.3
info:
  title: Сервис управления задачами
  version: 1.0.0
  description: |
    REST API задач внутри команд: роли, история изменений, кеш списка задач и SQL-отчет.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id: {type: integer, format: int64}
        email: {type: string, format: email}
        name: {type: string}
        created_at: {type: string, format: date-time}
    Token:
      type: object
      required: [access_token, token_type, expires_at]
      properties:
        access_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_at: {type: string, format: date-time}
    Team:
      type: object
      required: [id, name, created_by, role, created_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        created_by: {type: integer, format: int64}
        role: {type: string, enum: [owner, admin, member]}
        created_at: {type: string, format: date-time}
    Member:
      type: object
      required: [team_id, user_id, role]
      properties:
        team_id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        role: {type: string, enum: [admin, member]}
    Task:
      type: object
      required: [id, team_id, title, description, status, created_by, assignee_id, created_at, updated_at, closed_at, version]
      properties:
        id: {type: integer, format: int64}
        team_id: {type: integer, format: int64}
        title: {type: string}
        description: {type: string}
        status: {type: string, enum: [todo, in_progress, done]}
        created_by: {type: integer, format: int64}
        assignee_id: {type: integer, format: int64, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        closed_at: {type: string, format: date-time, nullable: true}
        version: {type: integer, format: int64}
    FieldChange:
      type: object
      required: [old, new]
      properties:
        old: {}
        new: {}
    HistoryEntry:
      type: object
      required: [id, task_id, changed_by, changes, created_at]
      properties:
        id: {type: integer, format: int64}
        task_id: {type: integer, format: int64}
        changed_by: {type: integer, format: int64}
        changes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FieldChange"
        created_at: {type: string, format: date-time}
    Comment:
      type: object
      required: [id, task_id, user_id, content, created_at]
      properties:
        id: {type: integer, format: int64}
        task_id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        content: {type: string}
        created_at: {type: string, format: date-time}
    TopAssignee:
      type: object
      required: [assignee_id, closed_count]
      properties:
        assignee_id: {type: integer, format: int64}
        closed_count: {type: integer}
    Stats:
      type: object
      required: [team_id, tasks_by_status, top_assignees, avg_close_seconds, comment_count]
      properties:
        team_id: {type: integer, format: int64}
        tasks_by_status:
          type: object
          additionalProperties: {type: integer}
        top_assignees:
          type: array
          items: {$ref: "#/components/schemas/TopAssignee"}
        avg_close_seconds: {type: number, format: double, nullable: true}
        comment_count: {type: integer, description: Общее число комментариев по задачам команды}
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8, maxLength: 72}
        name: {type: string}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
    InviteRequest:
      type: object
      required: [role]
      properties:
        user_id: {type: integer, format: int64}
        email: {type: string, format: email}
        role: {type: string, enum: [admin, member]}
      description: Нужен user_id, email или оба сразу. Если указаны оба, они должны указывать на одного пользователя.
    CreateTaskRequest:
      type: object
      required: [team_id, title]
      properties:
        team_id: {type: integer, format: int64}
        title: {type: string}
        description: {type: string}
        status: {type: string, enum: [todo, in_progress, done], default: todo}
        assignee_id: {type: integer, format: int64, nullable: true}
    UpdateTaskRequest:
      type: object
      required: [version]
      properties:
        title: {type: string}
        description: {type: string}
        status: {type: string, enum: [todo, in_progress, done]}
        assignee_id: {type: integer, format: int64, nullable: true}
        version: {type: integer, format: int64, minimum: 1, description: Версия задачи, которую клиент прочитал}
      description: |
        Передаются только изменяемые поля и version последнего прочитанного состояния.
        null в assignee_id снимает исполнителя.
        Создатель и администратор команды меняют любые поля. Создатель задачи меняет название, описание, статус и исполнителя.
        Исполнитель меняет только статус.
        Если version не совпадает с текущей строкой, ответ 409 и задача не меняется.
    CommentRequest:
      type: object
      required: [content]
      properties:
        content: {type: string}
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Нет или недействителен JWT
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Конфликт данных
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
paths:
  /healthz:
    get:
      summary: Проверка живости процесса
      operationId: health
      responses:
        "200":
          description: Процесс отвечает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
  /api/v1/register:
    post:
      summary: Регистрация пользователя
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/login:
    post:
      summary: Аутентификация и выдача JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Токен выдан
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/teams:
    post:
      summary: Создать команду
      description: Текущий пользователь становится создателем. Команда и участие создателя записываются в одной транзакции.
      operationId: createTeam
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTeamRequest"}
      responses:
        "201":
          description: Команда создана
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Team"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    get:
      summary: Список команд текущего пользователя
      operationId: listTeams
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Команды, где пользователь участник или создатель
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams:
                    type: array
                    items: {$ref: "#/components/schemas/Team"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/teams/{id}/invite:
    post:
      summary: Пригласить пользователя или сменить ему роль
      description: |
        Доступно создателю и администратору. Роль owner приглашением не выдается.
        Если пользователь уже в команде, сменить роль admin или member может только создатель.
        Администратор не может изменить роль создателя.
      operationId: invite
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InviteRequest"}
      responses:
        "200":
          description: Участник добавлен или его роль обновлена
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/teams/{team_id}/stats:
    get:
      summary: SQL-отчет по одной команде
      description: Доступен создателю и администратору этой команды. Считается одним SQL-запросом.
      operationId: teamStats
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: team_id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Статистика команды
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Stats"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/tasks:
    post:
      summary: Создать задачу
      description: Любой участник команды. Создатель задачи — текущий пользователь. Создание и первая запись истории атомарны.
      operationId: createTask
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTaskRequest"}
      responses:
        "201":
          description: Задача создана
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    get:
      summary: Список задач команды
      description: team_id обязателен. Ответ кешируется в Redis на 5 минут с учетом команды и фильтров.
      operationId: listTasks
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: team_id
          required: true
          schema: {type: integer, format: int64}
        - in: query
          name: status
          schema: {type: string, enum: [todo, in_progress, done]}
        - in: query
          name: assignee_id
          schema: {type: integer, format: int64}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Страница задач
          content:
            application/json:
              schema:
                type: object
                required: [tasks, limit, offset]
                properties:
                  tasks:
                    type: array
                    items: {$ref: "#/components/schemas/Task"}
                  limit: {type: integer}
                  offset: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/tasks/{id}:
    put:
      summary: Обновить задачу
      description: |
        Проверка прав по полям и запись истории выполняются в одной транзакции.
        Обновление проходит, только если version в теле совпадает с version строки. Иначе 409.
      operationId: updateTask
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateTaskRequest"}
      responses:
        "200":
          description: Задача обновлена
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/tasks/{id}/history:
    get:
      summary: История изменений задачи
      operationId: taskHistory
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: История
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items: {$ref: "#/components/schemas/HistoryEntry"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/tasks/{id}/comments:
    post:
      summary: Добавить комментарий
      description: Комментарий может оставить любой участник команды.
      operationId: addComment
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommentRequest"}
      responses:
        "201":
          description: Комментарий создан
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Comment"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    get:
      summary: Список комментариев задачи
      operationId: listComments
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Комментарии
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items: {$ref: "#/components/schemas/Comment"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
