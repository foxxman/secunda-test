services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tasks
      MYSQL_USER: tasks
      MYSQL_PASSWORD: tasks
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "tasks:tasks@tcp(mysql:3306)/tasks?parseTime=true&charset=utf8mb4&loc=UTC"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL: 24h
      CACHE_TTL: 5m
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql-data:
